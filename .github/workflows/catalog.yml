name: Catalog consistency

permissions:
  contents: write

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["data/**", "scripts/**", "README.md", ".github/workflows/catalog.yml"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "README.md"]

jobs:
  verify-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh stored GitHub metrics
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_metrics.py
      - run: python scripts/build_readme.py
      - run: python scripts/plot_timeline.py
      - name: Ensure generated files are committed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: git diff --exit-code -- README.md data/stats.json assets/timeline.svg
      - name: Commit scheduled metric refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/timeline.svg data/github_metrics.json data/ecosystem_github_stars.json data/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh GitHub metrics"
          git push
