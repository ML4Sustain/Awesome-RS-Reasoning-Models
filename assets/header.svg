  <g opacity=".45" fill="#a9d8e8"><circle cx="82" cy="55" r="2"/><circle cx="185" cy="242" r="1.5"/><circle cx="415" cy="42" r="1.5"/><circle cx="1045" cy="55" r="2"/><circle cx="1130" cy="218" r="1.5"/></g>
